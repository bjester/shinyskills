[package]
name = "shinyskills"
version = "0.1.0"
edition = "2021"
description = "A validation tool for Agent Skills (Rust port of the reference library agentskills/skills-ref)"
license = "MIT"

[dependencies]
clap = { version = "4.4", features = ["derive", "color"] }
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
thiserror = "1.0"
toml = "0.8"
globset = "0.4"
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3.8"

[[bin]]
name = "shinyskills"
path = "src/main.rs"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
borrowed_box = "warn"
exhaustive_enums = "warn"
exhaustive_structs = "warn"
must_use_candidate = "warn"
new_without_default = "warn"
ptr_arg = "warn"
should_implement_trait = "warn"
unwrap_used = "warn"
wrong_self_convention = "warn"
