name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# One publisher per tag, so duplicate runs for the same ref cannot race.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage archive contents
        run: |
          set -euo pipefail
          pkg="shinyskills-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "${pkg}"
          cp "target/${{ matrix.target }}/release/shinyskills" "${pkg}/shinyskills"
          cp README.md LICENSE "${pkg}/"
          tar -czf "${pkg}.tar.gz" "${pkg}"
          echo "Packaged:"
          tar -tzf "${pkg}.tar.gz"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: shinyskills-${{ github.ref_name }}-${{ matrix.target }}
          path: shinyskills-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download every archive from the matrix
        uses: actions/download-artifact@v4
        with:
          pattern: shinyskills-${{ github.ref_name }}-*
          path: release-assets
          merge-multiple: true

      - name: Generate one sorted checksum manifest
        run: |
          set -euo pipefail
          cd release-assets
          ls -1 | LC_ALL=C sort > ../assets.txt
          xargs -d '\n' -r sha256sum < ../assets.txt > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          generate_release_notes: true
